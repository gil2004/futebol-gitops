name: futebol

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: futebol
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol -d futebol"]
      interval: 5s
      timeout: 3s
      retries: 10
    # sem "ports": a BD só é acessível dentro da rede do compose

  web:
    build: ./app
    image: ${WEB_IMAGE:-futebol:dev}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://futebol:${POSTGRES_PASSWORD}@db:5432/futebol
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true


  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true


networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:

