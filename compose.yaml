name: futebol

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: futebol
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol -d futebol"]
      interval: 5s
      timeout: 3s
      retries: 10
    # sem "ports": a BD só é acessível dentro da rede do compose

  web:
    build: ./app
    image: futebol:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://futebol:${POSTGRES_PASSWORD}@db:5432/futebol
    ports:
      - "8000:8000"          # temporário: no passo do nginx deixa de estar exposta
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata: