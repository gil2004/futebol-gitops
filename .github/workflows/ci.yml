name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar compose.yaml
        working-directory: .
        env:
          POSTGRES_PASSWORD: so-para-validar
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Instalar dependências
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest


  imagem:
    name: Build e scan da imagem
    needs: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: futebol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: futebol:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  smoke:
    name: Smoke test (compose)
    needs: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar .env de teste
        run: |
          cp .env.example .env
          sed -i 's/^FOOTBALL_DATA_TOKEN=.*/FOOTBALL_DATA_TOKEN=ci-falso/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-falso/' .env

      - name: Gerar certificado autoassinado
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout nginx/certs/localhost-key.pem \
            -out nginx/certs/localhost.pem
          chmod 644 nginx/certs/localhost-key.pem

      - name: Arrancar a stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: HTTPS responde no /healthz
        run: |
          curl --fail --silent --show-error \
            --cacert nginx/certs/localhost.pem \
            https://localhost/healthz

      - name: HTTP redireciona para HTTPS
        run: |
          curl --silent --head http://localhost | grep -q "301"

      - name: Logs (só se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Desligar a stack
        if: always()
        run: docker compose down -v
