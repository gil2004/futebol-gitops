# Esconde a versão do nginx nas respostas e páginas de erro
server_tokens off;

# --- HTTP: só serve para redirecionar para HTTPS ---
server {
    listen 8080;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# --- HTTPS: a porta de entrada da app ---
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    # Certificado (público) + chave privada (segredo), gerados pelo mkcert
    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # versões antigas e inseguras ficam de fora

    # A app não recebe uploads: pedidos grandes são recusados logo aqui
    client_max_body_size 1m;

    location / {
        # "web" é o nome do serviço no compose (DNS interno)
        proxy_pass http://web:8000;

        # Diz à app quem é o cliente real e que o pedido original veio por HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}